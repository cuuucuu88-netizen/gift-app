name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create my-app com.gift.app GiftApp
          cd my-app
          rm -rf www
          cp -r ../www .
          cp ../config.xml .
          cordova platform add android

      - name: Build APK
        run: |
          cd my-app
          cordova build android

      - name: Find and List APKs
        run: find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-compiled-apk
          path: |
            my-app/platforms/android/app/build/outputs/apk/**/*.apk
            my-app/**/*.apk
            **/*.apk
